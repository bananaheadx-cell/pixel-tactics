<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Tactics</title><script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script><style>:root{--bg:#0b0f1a;--panel:#161d2e;--line:#2b3448;--a:#4da3ff;--text:#e6ecf7;--muted:#8496b5}*{box-sizing:border-box}body{margin:0;padding:14px;background:radial-gradient(circle at 25% -10%,#1d2742,var(--bg) 60%);color:var(--text);font-family:Arial,sans-serif}.wrap{max-width:1120px;margin:auto}h1{margin:0;color:var(--a);font-size:22px}.sub,#campaign{color:var(--muted);font-size:13px;margin:4px 0 12px}.layout{display:grid;grid-template-columns:290px 1fr;gap:12px}@media(max-width:850px){.layout{grid-template-columns:1fr}}.card{background:var(--panel);border:2px solid var(--line);padding:10px;border-radius:5px}.card h3{margin:0 0 8px;color:var(--a);font-size:12px}.pick{display:flex;flex-direction:column;gap:5px}.pick button{display:flex;flex-direction:column;text-align:left;padding:7px;background:#202a40;border:2px solid var(--line);color:var(--text);cursor:pointer;border-radius:3px}.pick button.on,.pick button:hover{border-color:var(--a);background:#23395a}.pick small{color:var(--muted);font-size:10px;margin-top:3px}.btn{width:100%;padding:9px;margin-top:6px;border:0;border-radius:3px;background:var(--a);font-weight:bold;cursor:pointer}.btn.ghost{background:#2a3450;color:var(--text)}.btn:disabled{opacity:.4}.bar{display:flex;gap:6px}.bar .btn{flex:1}#turnBox{padding:9px;background:#1d2b45;border:2px solid var(--line);min-height:40px;margin-bottom:8px}#stage{display:flex;justify-content:center;overflow:auto}#log{height:210px;overflow:auto;background:#0c1120;padding:8px;font-size:11px;line-height:1.65}.hl{color:#4da3ff}.dm{color:#ffb454}.ko{color:#ff6b6b}</style></head><body><div class="wrap"><h1>PIXEL TACTICS</h1><div class="sub">Turn-based Pixel Strategy · Campaign Mode</div><div id="campaign"></div><div class="layout"><aside><div class="card"><h3>SELECT UNIT</h3><div class="pick" id="picker"></div><div style="margin-top:8px">วางแล้ว <b id="cnt">0</b> / 6</div><button class="btn" id="btnStart">▶ เริ่มการต่อสู้</button><button class="btn ghost" id="btnAuto" style="display:none">🤖 ต่อสู้อัตโนมัติ</button><button class="btn ghost" id="btnNext" style="display:none">➡️ ด่านถัดไป</button><button class="btn ghost" id="btnReset">🔄 เล่นใหม่</button></div><div class="card" style="margin-top:12px"><h3>BATTLE LOG</h3><div id="log"></div></div></aside><main class="card"><div id="turnBox">โหมดจัดทัพ — เลือกยูนิตทางซ้าย แล้วคลิกช่อง</div><div id="stage"></div></main></div></div><script src="game.js"></script></body></html>
