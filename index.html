<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Tactics</title><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script><style>:root{--bg:#0b0f1a;--p:#161d2e;--l:#2b3448;--a:#4da3ff;--t:#e6ecf7}*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at 25% -10%,#1d2742,var(--bg) 60%);color:var(--t);font-family:Kanit,Tahoma,sans-serif}.wrap{max-width:1020px;margin:auto}h1{font:16px 'Press Start 2P';color:var(--a);margin:0 0 6px}.sub{color:#8496b5;font-size:12px;margin-bottom:14px}.layout{display:grid;grid-template-columns:278px 1fr;gap:14px}.card{background:var(--p);border:3px solid var(--l);border-radius:4px;padding:12px;box-shadow:0 4px #0a0e18}.card h3{font:10px 'Press Start 2P';color:var(--a);margin:0 0 10px}.pick{display:flex;flex-direction:column;gap:5px}.pick button,.diff button,.bar button{display:flex;gap:8px;align-items:center;background:#202a40;border:2px solid var(--l);border-radius:3px;padding:7px;color:var(--t);cursor:pointer;font-family:Kanit}.pick button.on,.diff button.on{border-color:var(--a);background:#23395a}.nm{font-weight:600}.ds{font-size:10px;color:#8496b5}.counter{margin:10px 0;color:#8496b5;font-size:12px}.counter b{color:var(--a);font-size:15px}.diff{display:flex;gap:5px;margin:8px 0}.diff button{flex:1;justify-content:center;font:8px 'Press Start 2P';color:#8496b5}.btn{width:100%;padding:9px;border:0;border-radius:3px;cursor:pointer;margin-top:5px;font:600 13px Kanit;background:var(--a);color:#04101f}.btn.ghost{background:#2a3450;color:var(--t)}.bar{display:flex;margin:8px 0}.bar button{width:100%}#turnBox{font-size:13px;padding:9px 12px;background:#1d2b45;border:2px solid var(--l);border-radius:3px;margin-bottom:10px;min-height:40px}#stage{display:flex;justify-content:center}#log{height:190px;overflow:auto;background:#0c1120;border:2px solid var(--l);border-radius:3px;padding:9px;font-size:11px;line-height:1.75}.hl{color:var(--a)}.dm{color:#ffb454}.ko{color:#ff6b6b}.ai{color:#c084fc}@media(max-width:820px){.layout{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>PIXEL TACTICS</h1><div class="sub">Turn-based 3×3 · Phaser 3 · Weapon FX · Floating Damage</div><div class="layout"><div><div class="card"><h3>SELECT UNIT</h3><div id="picker" class="pick"></div><div class="counter">วางแล้ว <b id="cnt">0</b> / 6</div><div id="diff" class="diff"><button data-d="easy">EASY</button><button data-d="normal" class="on">NORMAL</button><button data-d="hard">HARD</button></div><div id="editBar" class="bar" style="display:none"><button>✖ ลบยูนิตที่เลือก</button></div><button id="btnStart" class="btn">▶ เริ่มการต่อสู้</button><button id="btnRandom" class="btn ghost">🎲 สุ่มจัดทัพ</button><button id="btnClear" class="btn ghost">🗑 ล้างกระดาน</button><button id="btnReset" class="btn ghost" style="display:none">🔄 เล่นใหม่</button></div><div class="card" style="margin-top:14px"><h3>BATTLE LOG</h3><div id="log"></div></div></div><div class="card"><div id="turnBox">โหมดจัดทัพ — เลือกยูนิตทางซ้าย แล้วคลิกช่อง</div><div id="stage"></div></div></div></div><script>const GRID=3,MAX=6,CELL=88,GAP=8,PAD=16,ORDER=['sword','spear','gun','bow','cannon','axe'];const TYPES={sword:{name:'ดาบ',icon:'⚔',role:'MELEE',hp:140,atk:48,crit:.12,ds:'ตัวหน้าสุดในคอลัมน์'},spear:{name:'หอก',icon:'⟶',role:'PIERCE',hp:115,atk:40,crit:.10,ds:'ตัวหน้า + ตัวถัดไป 100/50%'},gun:{name:'ปืน',icon:'▰',role:'RIFLE',hp:95,atk:34,crit:.15,ds:'ยิงทะลุคอลัมน์ 100/60/30%'},bow:{name:'ธนู',icon:'➶',role:'RANGED',hp:75,atk:56,crit:.20,ds:'เล็งช่องใดก็ได้'},cannon:{name:'ปืนใหญ่',icon:'✹',role:'BLAST',hp:60,atk:30,crit:.08,ds:'กากบาท 70/45%'},axe:{name:'ขวาน',icon:'🪓',role:'ROW',hp:110,atk:30,crit:.12,ds:'ฟันแถว 3 ช่อง'}};const S={phase:'deploy',turn:'player',busy:false,ai:'normal',g:{player:[[null,null,null],[null,null,null],[null,null,null]],bot:[[null,null,null],[null,null,null],[null,null,null]]},v:{player:[[null,null,null],[null,null,null],[null,null,null]]},pick:null,selected:null};const $=id=>document.getElementById(id),wait=ms=>new Promise(r=>setTimeout(r,ms)),front=s=>s==='bot'?[2,1,0]:[0,1,2],coord=(r,c)=>String.fromCharCode(65+c)+(r+1),mk=t=>({type:t,hp:TYPES[t].hp,max:TYPES[t].hp});function alive(s){return S.g[s].flat().filter(u=>u&&u.hp>0)}function targets(u,r,c,side){let o=[];if(u.type==='bow')o=[{r,c,q:1}];else if(u.type==='axe'){let ar=front(side).find(x=>S.g[side][x].some(u=>u&&u.hp>0));if(r===ar)o=[0,1,2].map(c=>({r:ar,c,q:1}))}else{let rows=front(side).filter(x=>S.g[side][x][c]?.hp>0),qs=u.type==='spear'?[1,.5]:u.type==='gun'?[1,.6,.3]:[1];o=qs.map((q,i)=>rows[i]!=null?{r:rows[i],c,q}:null).filter(Boolean)}if(u.type==='cannon')o=[{r,c,q:.7},...[[r-1,c],[r+1,c],[r,c-1],[r,c+1]].map(([r,c])=>({r,c,q:.45}))].filter(x=>x.r>=0&&x.r<3&&x.c>=0&&x.c<3);return o}function dmg(u,r,c,side){return targets(u,r,c,side).map(h=>{let crit=Math.random()<u.crit,b=Math.max(1,Math.round(u.atk*h.q*(.85+Math.random()*.3)));return{...h,damage:crit?Math.round(b*1.5):b,crit}})}function paint(c,t,team){let x=c.getContext('2d'),p=team==='player'?'#4da3ff':'#ff6b6b';x.fillStyle='#141824';x.fillRect(8,4,24,26);x.fillStyle=p;x.fillRect(10,7,20,18);x.fillStyle='#f2c48d';x.fillRect(16,9,8,8);x.fillStyle='#cfd8e6';if(t==='sword')x.fillRect(20,0,3,18);if(t==='spear')x.fillRect(29,3,3,27);if(t==='gun')x.fillRect(26,10,12,4);if(t==='bow'){x.strokeStyle='#ffd166';x.lineWidth=2;x.strokeRect(25,5,9,22)}if(t==='cannon')x.fillRect(27,8,11,9);if(t==='axe'){x.fillStyle='#ff3333';x.fillRect(27,4,9,7);x.fillRect(30,7,3,8)}}function icon(t){let c=document.createElement('canvas');c.width=40;c.height=36;paint(c,t,'player');return c.toDataURL()}function picker(){ $('picker').innerHTML=ORDER.map(t=>{let u=TYPES[t];return `<button data-t="${t}" class="${S.pick===t?'on':''}"><img src="${icon(t)}" width="40" height="36"><span><span class="nm">${u.name} [${u.role}]</span><br><span class="ds">HP ${u.hp} · ATK ${u.atk} · CRIT ${u.crit*100|0}%<br>${u.ds}</span></span></button>`}).join('')}function log(s,c=''){let d=document.createElement('div');d.textContent=s;d.className=c;$('log').appendChild(d);$('log').scrollTop=1e9}function setTurn(s){$('turnBox').textContent=s}const W=3*CELL+2*GAP+PAD*2,H=2*(3*CELL+2*GAP)+62+PAD*2;let scene;function cx(c){return PAD+c*(CELL+GAP)+CELL/2}function cy(side,r){return(side==='bot'?40:40+3*(CELL+GAP)+62)+r*(CELL+GAP)+CELL/2}function view(side,r,c,u){let co=scene.add.container(cx(c),cy(side,r)),spr=scene.add.rectangle(0,0,42,52,side==='bot'?0xff6b6b:0x4da3ff),we=scene.add.text(0,0,TYPES[u.type].icon,{fontSize:'25px'}).setOrigin(.5),hp=scene.add.text(0,-34,u.hp,{fontFamily:'"Press Start 2P"',fontSize:'9px',color:'#4ade80',stroke:'#000',strokeThickness:4}).setOrigin(.5),role=scene.add.text(0,34,TYPES[u.type].role,{fontFamily:'"Press Start 2P"',fontSize:'5px',color:'#fff',stroke:'#000',strokeThickness:3}).setOrigin(.5);co.add([spr,we,hp,role]);co.hp=hp;co.spr=spr;S.v[side][r][c]=co;return co}function refresh(){for(let s of ['player','bot'])for(let r=0;r<3;r++)for(let c=0;c<3;c++){let u=S.g[s][r][c],v=S.v[s]?.[r]?.[c];if(u&&!v)view(s,r,c,u);if(!u&&v){v.destroy();S.v[s][r][c]=null}if(u&&v)v.hp.setText(u.hp)}}function pop(x,y,n,crit){let t=scene.add.text(x+(Math.random()-.5)*28,y-10,(crit?'CRIT! ':'')+'-'+n,{fontFamily:'"Press Start 2P"',fontSize:crit?'22px':'17px',color:crit?'#ff3b3b':'#fff',stroke:'#000',strokeThickness:5}).setOrigin(.5).setDepth(99);scene.tweens.add({targets:t,y:y-65,alpha:0,scale:crit?1.4:1.1,duration:900,onComplete:()=>t.destroy()})}async function attack(side,from,tr,tc){S.busy=true;let u=S.g[side][from.r][from.c],foe=side==='player'?'bot':'player',hits=dmg(u,tr,tc,foe),v=S.v[side][from.r][from.c];log(`${side==='player'?'[คุณ]':'[บอท]'} ${TYPES[u.type].name} → ${coord(tr,tc)}`,'hl');if(u.type==='axe'){let ar=hits[0]?.r,sx=side==='player'?cx(0)-70:cx(2)+70,ex=side==='player'?cx(2)+70:cx(0)-70;await new Promise(d=>scene.tweens.add({targets:v,x:sx,y:cy(foe,ar),duration:180,onComplete:d}));await new Promise(d=>scene.tweens.add({targets:v,x:ex,duration:500,onComplete:d}))}else await new Promise(d=>scene.tweens.add({targets:v,y:v.y+(side==='player'?-35:35),duration:180,yoyo:true,onComplete:d=>d()}));for(let h of hits){let t=S.g[foe][h.r][h.c];if(!t)continue;t.hp=Math.max(0,t.hp-h.damage);let tv=S.v[foe][h.r][h.c];pop(tv.x,tv.y,h.damage,h.crit);log(` → ${TYPES[t.type].name} ${coord(h.r,h.c)} รับ ${h.damage} dmg${h.crit?' CRIT!':''}`,h.crit?'hl':'dm');if(t.hp===0){log(` 💀 ${TYPES[t.type].name} ถูกทำลาย`,'ko');S.g[foe][h.r][h.c]=null;tv.destroy();S.v[foe][h.r][h.c]=null}}await wait(250);if(!alive(foe).length){S.phase='over';setTurn(side==='player'?'🏆 VICTORY — คุณชนะ!':'💀 DEFEAT — คุณแพ้...');$('btnReset').style.display='block';S.busy=false;return}S.busy=false;S.turn=foe;if(foe==='bot')bot();else setTurn('🟢 เทิร์นของคุณ — คลิกยูนิตแล้วเลือกเป้าหมาย');refresh()}function bot(){S.busy=true;setTurn(`🤖 บอท (${S.ai.toUpperCase()}) กำลังคิด...`);setTimeout(()=>{let o=[];for(let r=0;r<3;r++)for(let c=0;c<3;c++){let u=S.g.bot[r][c];if(!u)continue;for(let tr=0;tr<3;tr++)for(let tc=0;tc<3;tc++){let h=dmg(u,tr,tc,'player');if(h.length)o.push({r,c,tr,tc,score:h.reduce((a,x)=>a+x.damage,0)})}}o.sort((a,b)=>b.score-a.score);let m=o[S.ai==='hard'?0:Math.floor(Math.random()*Math.min(o.length,S.ai==='easy'?6:3))];if(m)attack('bot',{r:m.r,c:m.c},m.tr,m.tc)},S.ai==='easy'?500:S.ai==='hard'?1000:750)}function deployBot(){[[2,['sword','spear','sword']],[1,['bow','gun','cannon']]].forEach(([r,a])=>a.forEach((t,c)=>S.g.bot[r][c]=mk(t)));refresh()}class Game extends Phaser.Scene{create(){scene=this;for(let s of ['bot','player'])for(let r=0;r<3;r++)for(let c=0;c<3;c++){this.add.rectangle(cx(c),cy(s,r),CELL,CELL,0x1e2740).setStrokeStyle(3,0x59657c);this.add.text(cx(c)-36,cy(s,r)-36,coord(r,c),{fontFamily:'"Press Start 2P"',fontSize:'7px',color:'#8496b5'});this.add.zone(cx(c),cy(s,r),CELL,CELL).setInteractive().on('pointerdown',()=>click(s,r,c))}refresh()}}new Phaser.Game({type:Phaser.AUTO,parent:'stage',width:W,height:H,backgroundColor:'#0d1322',pixelArt:true,scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_HORIZONTALLY},scene:[Game]});function click(s,r,c){if(S.busy||S.phase==='over')return;if(S.phase==='deploy'){if(s!=='player')return;if(S.selected){let a=S.selected,b=S.g.player[r][c];S.g.player[r][c]=S.g.player[a.r][a.c];S.g.player[a.r][a.c]=b;S.selected=null}else if(S.g.player[r][c])S.selected={r,c};else if(S.pick&&S.g.player.flat().filter(Boolean).length<MAX)S.g.player[r][c]=mk(S.pick);render();refresh();return}if(S.turn!=='player')return;if(s==='player'&&S.g.player[r][c]){S.selected={r,c};setTurn(`🎯 ${TYPES[S.g.player[r][c].type].name} — ${TYPES[S.g.player[r][c].type].ds}`)}else if(s==='bot'&&S.selected){let u=S.g.player[S.selected.r][S.selected.c];if(u.type==='axe'){let ar=front('bot').find(x=>S.g.bot[x].some(z=>z));if(r!==ar)return setTurn('🔒 ขวานโจมตีได้เฉพาะแถวหน้าสุด')}let f=S.selected;S.selected=null;attack('player',f,r,c)}}$('picker').onclick=e=>{let b=e.target.closest('button');if(!b)return;S.pick=S.pick===b.dataset.t?null:b.dataset.t;S.selected=null;render()};$('diff').onclick=e=>{let b=e.target.closest('button');if(b){S.ai=b.dataset.d;render()}};$('editBar').onclick=()=>{if(S.selected){S.g.player[S.selected.r][S.selected.c]=null;S.selected=null;render();refresh()}};$('btnClear').onclick=()=>{S.g.player=[[null,null,null],[null,null,null],[null,null,null]];S.selected=null;render();refresh()};$('btnRandom').onclick=()=>{S.g.player=[[null,null,null],[null,null,null],[null,null,null]];let a=[...Array(9)].map((_,i)=>[i/3|0,i%3]);a.sort(()=>Math.random()-.5).slice(0,6).forEach(([r,c])=>S.g.player[r][c]=mk(ORDER[Math.random()*6|0]));render();refresh()};$('btnStart').onclick=()=>{deployBot();S.phase='battle';S.turn='player';S.pick=null;S.selected=null;log('════ ⚔️ BATTLE START ════','hl');setTurn('🟢 เทิร์นของคุณ — คลิกยูนิตแล้วเลือกเป้าหมาย');render()};$('btnReset').onclick=()=>location.reload();log('👋 ยินดีต้อนรับสู่ PIXEL TACTICS!');log('💡 เลือกยูนิต → คลิกเป้าหมายเพื่อโจมตี');render();</script></body></html>
