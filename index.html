<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Pixel Tactics</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#080d17;color:#eaf0fa;font-family:Arial,sans-serif}.app{height:100vh;display:grid;grid-template-columns:300px 1fr;gap:10px;padding:10px}.left{min-height:0;display:flex;flex-direction:column;gap:8px}.card{background:#151d2e;border:2px solid #303b54;border-radius:5px;padding:9px}.title{font-weight:bold;font-size:18px;color:#4da3ff}.sub,.info{font-size:10px;color:#8292ad}.mode{display:flex;gap:4px}.mode button,.stage,.unit,.action,.sound button{border:2px solid #303b54;background:#202a40;color:#eaf0fa;border-radius:4px;cursor:pointer}.mode button{flex:1;padding:6px}.on{border-color:#4da3ff!important;background:#23395a!important;color:#4da3ff!important}.stages{min-height:0;overflow:auto}.chap{margin-bottom:7px}.chapname{font-size:10px;color:#4da3ff;margin-bottom:3px}.stagegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.stage{height:30px;font-size:10px}.stage.done{border-color:#4ade80;color:#4ade80}.stage:disabled{opacity:.25;cursor:not-allowed}.units{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.unit{padding:5px 2px;font-size:10px}.unit b{display:block;font-size:18px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:5px}.action{padding:7px;font-size:11px}.primary{background:#4da3ff!important;color:#061120!important}.auto{grid-column:span 2}.right{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}.battle{width:min(780px,100%);height:calc(100vh - 20px);display:flex;flex-direction:column}.top{display:flex;gap:7px;margin-bottom:7px}.status{flex:1;background:#17233a;border:2px solid #303b54;padding:8px;border-radius:4px;font-size:12px}.sound{display:flex;gap:3px}.sound button{width:38px;font-size:16px}.boardwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.board{width:min(72vh,700px);height:min(72vh,700px);max-width:100%;max-height:100%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:7px;padding:7px;background:#111a2a;border:3px solid #303b54;border-radius:7px}.cell{position:relative;background:#1d2940;border:2px solid #34415c;border-radius:4px;display:flex;align-items:center;justify-content:center}.piece{text-align:center}.icon{font-size:clamp(28px,6vw,54px);filter:drop-shadow(0 3px 1px #000)}.hp{font-size:10px;text-shadow:1px 1px #000}.float{position:absolute;font:bold clamp(18px,3vw,32px) Arial;color:white;text-shadow:-2px -2px #000,2px -2px #000,-2px 2px #000,2px 2px #000;animation:up .7s ease-out forwards;z-index:9;pointer-events:none}.crit{color:#ff3030}@keyframes up{to{opacity:0;transform:translate(var(--dx),-60px) scale(1.15)}}.log{height:72px;margin-top:7px;overflow:auto;background:#0b111e;border:2px solid #303b54;padding:5px 8px;font-size:10px}@media(max-width:760px){.app{grid-template-columns:220px 1fr;padding:5px}.units{grid-template-columns:repeat(2,1fr)}.board{width:min(65vh,100%);height:min(65vh,100%)}}</style></head><body><div class="app"><aside class="left"><div class="card"><div class="title">PIXEL TACTICS</div><div class="sub">3×3 TURN-BASED GRID WAR</div></div><div class="card"><b>โหมดเกม</b><div class="mode"><button id="free">อิสระ</button><button id="adv" class="on">ผจญภัย</button></div></div><div class="card stages"><b>เลือกด่านผจญภัย</b><div id="stages"></div></div><div class="card"><b>SELECT UNIT</b><div class="info" id="info">เลือกยูนิตแล้วคลิกช่องเพื่อวาง</div><div class="units" id="units"></div><div class="actions"><button class="action primary" id="start">▶ เริ่ม</button><button class="action" id="clear">🗑 ล้าง</button><button class="action auto" id="auto">🤖 Auto Battle: OFF</button><button class="action" id="surrender">🏳 ยอมแพ้</button><button class="action" id="new">🔄 เล่นใหม่</button></div></div></aside><main class="right"><div class="battle"><div class="top"><div class="status" id="status">Adventure — จัดทัพ</div><div class="sound"><button id="music" title="ดนตรี">🎵</button><button id="fx" title="เอฟเฟกต์">🔊</button></div></div><div class="boardwrap"><div class="board" id="board"></div></div><div class="log" id="log"></div></div></main></div><script>
const T=[['⚔️','Sword',15,22],['🔱','Spear',13,20],['🔫','Gun',12,24],['🏹','Bow',10,25],['💣','Cannon',18,30],['🪓','Axe',16,28]],N=25,C=['ที่ราบเริ่มต้น','ป่าพิษเงามืด','ทะเลทรายเพลิง','ยอดเขาน้ำแข็ง','ปราสาทมืด'];let st=1,mode='adventure',phase='deploy',pick=null,form=[],auto=false,music=true,fx=true,token=0,prog=JSON.parse(localStorage.getItem('pt_campaign')||'{"clear":{}}'),ctx,bgm;
const $=id=>document.getElementById(id),wait=m=>new Promise(r=>setTimeout(r,m)),write=x=>{$('log').innerHTML+='<div>'+x+'</div>';$('log').scrollTop=99999};function save(){localStorage.setItem('pt_campaign',JSON.stringify(prog))}function unlocked(n){return n===1||!!prog.clear[n-1]}function stages(){let h='';for(let c=0;c<5;c++){h+='<div class="chap"><div class="chapname">บทที่ '+(c+1)+' — '+C[c]+'</div><div class="stagegrid">';for(let i=1;i<=5;i++){let n=c*5+i;h+=`<button class="stage ${prog.clear[n]?'done':''} ${n===st?'on':''}" ${unlocked(n)?'':'disabled'} onclick="choose(${n})">${i}</button>`}h+='</div></div>'}$('stages').innerHTML=h}function choose(n){if(phase==='battle')return;st=n;loadForm();stages();$('status').textContent='ด่าน '+st+' — จัดทัพ'}function units(){$('units').innerHTML=T.map((x,i)=>`<button class="unit" onclick="selectUnit(${i})"><b>${x[0]}</b>${x[1]}</button>`).join('')}function selectUnit(i){if(phase!=='deploy'||mode!=='adventure')return;if(form.length>=6)return;pick=i;$('info').textContent='เลือกช่องเพื่อวาง '+T[i][1]}function key(){return 'pt_form_'+st}function loadForm(){form=JSON.parse(localStorage.getItem(key())||'[]');draw()}function resetForm(){form=[];localStorage.removeItem(key());draw();$('info').textContent='เลือกยูนิตแล้วคลิกช่องเพื่อวาง'}function place(r,c){if(phase!=='deploy'||pick===null)return;if(form.some(u=>u.r===r&&u.c===c)||form.length>=6)return;form.push({type:pick,r,c});localStorage.setItem(key(),JSON.stringify(form));pick=null;draw();$('info').textContent='🔒 ตำแหน่งถูกล็อกสำหรับ Adventure นี้'}function draw(){let b=$('board');b.innerHTML='';for(let r=0;r<3;r++)for(let c=0;c<3;c++){let e=document.createElement('div');e.className='cell';let u=form.find(x=>x.r===r&&x.c===c);if(u)e.innerHTML=`<div class="piece"><div class="icon">${T[u.type][0]}</div><div class="hp">${T[u.type][1]}</div></div>`;e.onclick=()=>place(r,c);b.appendChild(e)}}function enemies(){let n=Math.min(6,2+Math.floor((st-1)/2));return Array.from({length:n},(_,i)=>({type:(i+st)%6,r:Math.floor(i/3),c:2-(i%3),hp:100}))}function sfx(i){if(!fx)return;ctx??=new AudioContext();let o=ctx.createOscillator(),g=ctx.createGain(),f=[180,280,600,850,80,120][i];o.type=i===4?'sawtooth':i===5?'square':'triangle';o.frequency.value=f;g.gain.value=.05;o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.14)}function musicStart(){if(!music)return;ctx??=new AudioContext();clearInterval(bgm);bgm=setInterval(()=>{if(!music)return;let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=[196,247,294,330][Math.floor(Date.now()/900)%4];g.gain.value=.012;o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.3)},900)}function damage(u,d,crit){let e=[...$('board').children][u.r*3+u.c],f=document.createElement('div');f.className='float '+(crit?'crit':'');f.textContent='-'+d;f.style.setProperty('--dx',(Math.random()*70-35)+'px');e.appendChild(f);setTimeout(()=>f.remove(),750)}function renderBattle(en){let b=$('board');b.innerHTML='';for(let r=0;r<3;r++)for(let c=0;c<3;c++){let e=document.createElement('div');e.className='cell';let u=form.find(x=>x.r===r&&x.c===c&&x.hp>0)||en.find(x=>x.r===r&&x.c===c&&x.hp>0);if(u)e.innerHTML=`<div class="piece"><div class="icon">${T[u.type][0]}</div><div class="hp">${Math.max(0,u.hp)} HP</div></div>`;b.appendChild(e)}}async function battle(){if(!form.length){write('⚠ กรุณาวางยูนิต');return}phase='battle';let my=form.map(x=>({...x,hp:100}));form=my;let en=enemies(),me=++token;$('start').disabled=true;$('clear').disabled=true;$('status').textContent='⚔️ ด่าน '+st;musicStart();renderBattle(en);while(me===token&&my.some(x=>x.hp>0)&&en.some(x=>x.hp>0)){for(let u of my.filter(x=>x.hp>0)){let t=en.find(x=>x.hp>0);if(!t)break;hit(u,t);renderBattle(en);await wait(auto?140:380)}for(let u of en.filter(x=>x.hp>0)){let t=my.find(x=>x.hp>0);if(!t)break;hit(u,t);renderBattle(en);await wait(auto?140:380)}}if(me!==token)return;if(my.some(x=>x.hp>0)&&!en.some(x=>x.hp>0))win();else lose()}function hit(a,t){let z=T[a.type],d=Math.floor(z[2]+Math.random()*(z[3]-z[2]+1)),cr=Math.random()<.15;if(cr)d=Math.round(d*1.5);t.hp-=d;sfx(a.type);damage(t,d,cr);write(`${z[0]} ${z[1]} → -${d}${cr?' CRIT!':''}`)}function win(){prog.clear[st]=1;save();let old=st;if(st<N)st++;phase='deploy';form=form.map(x=>({type:x.type,r:x.r,c:x.c}));stages();draw();$('start').disabled=false;$('clear').disabled=false;if(st<=N){$('status').textContent='🏆 ชนะ! ➜ ด่าน '+st;if(auto)setTimeout(battle,650)}else{$('status').textContent='🏆 จบการผจญภัย';auto=false}}function lose(){phase='deploy';token++;auto=false;$('auto').textContent='🤖 Auto Battle: OFF';$('start').disabled=false;$('clear').disabled=false;$('status').textContent='💀 แพ้ — กด เล่นใหม่ เพื่อจัดทัพใหม่';draw()}function chooseMode(m){mode=m;phase='deploy';$('free').classList.toggle('on',m==='free');$('adv').classList.toggle('on',m==='adventure');$('status').textContent=m==='adventure'?'Adventure — จัดทัพ':'โหมดอิสระ'}$('start').onclick=battle;$('clear').onclick=()=>{if(phase==='deploy')resetForm()};$('surrender').onclick=()=>{if(phase==='battle'){token++;phase='deploy';auto=false;$('auto').textContent='🤖 Auto Battle: OFF';resetForm();$('status').textContent='🏳 ยอมแพ้ — จัดทัพใหม่ได้'}};$('new').onclick=()=>{token++;prog={clear:{}};save();st=1;auto=false;resetForm();stages();$('status').textContent='🔄 Adventure ใหม่'};$('auto').onclick=()=>{auto=!auto;$('auto').textContent=auto?'🤖 Auto Battle: ON':'🤖 Auto Battle: OFF';if(auto&&phase==='deploy')battle()};$('free').onclick=()=>chooseMode('free');$('adv').onclick=()=>{chooseMode('adventure');loadForm()};$('music').onclick=()=>{music=!music;$('music').textContent=music?'🎵':'🔇';if(music)musicStart();else clearInterval(bgm)};$('fx').onclick=()=>{fx=!fx;$('fx').textContent=fx?'🔊':'🔇'};document.addEventListener('pointerdown',()=>musicStart(),{once:true});units();stages();loadForm();
</script></body></html>
