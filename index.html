<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Tactics</title><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script><style>:root{--bg:#0b0f1a;--p:#161d2e;--l:#2b3448;--a:#4da3ff;--t:#e6ecf7}*{box-sizing:border-box}body{margin:0;padding:16px;background:radial-gradient(circle at 25% -10%,#1d2742,var(--bg) 60%);color:var(--t);font-family:Kanit,Tahoma,sans-serif}.wrap{max-width:1020px;margin:auto}h1{font:16px 'Press Start 2P';color:var(--a);margin:0 0 6px}.sub,#campaign{color:#8496b5;font-size:12px;margin-bottom:8px}.layout{display:grid;grid-template-columns:278px 1fr;gap:14px}.card{background:var(--p);border:3px solid var(--l);border-radius:4px;padding:12px;box-shadow:0 4px #0a0e18}.card h3{font:10px 'Press Start 2P';color:var(--a);margin:0 0 10px}.pick{display:flex;flex-direction:column;gap:5px}.pick button,.diff button,.bar button{display:flex;gap:8px;align-items:center;background:#202a40;border:2px solid var(--l);border-radius:3px;padding:7px;color:var(--t);cursor:pointer;font-family:Kanit}.pick button.on,.diff button.on{border-color:var(--a);background:#23395a}.nm{font-weight:600}.ds{font-size:10px;color:#8496b5}.counter{margin:10px 0;color:#8496b5;font-size:12px}.counter b{color:var(--a);font-size:15px}.diff{display:flex;gap:5px;margin:8px 0}.diff button{flex:1;justify-content:center;font:8px 'Press Start 2P';color:#8496b5}.btn{width:100%;padding:9px;border:0;border-radius:3px;cursor:pointer;margin-top:5px;font:600 13px Kanit;background:var(--a);color:#04101f}.btn.ghost{background:#2a3450;color:var(--t)}.bar{display:flex;gap:5px;margin:8px 0}.bar button{width:100%;justify-content:center}.bar button.ready{border-color:#c084fc;background:#392752;color:#fff}#turnBox{font-size:13px;padding:9px 12px;background:#1d2b45;border:2px solid var(--l);border-radius:3px;margin-bottom:10px;min-height:40px}#stage{display:flex;justify-content:center}#log{height:190px;overflow:auto;background:#0c1120;border:2px solid var(--l);border-radius:3px;padding:9px;font-size:11px;line-height:1.75}.hl{color:var(--a)}.dm{color:#ffb454}.ko{color:#ff6b6b}.ai{color:#c084fc}@media(max-width:820px){.layout{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>PIXEL TACTICS</h1><div class="sub">Turn-based 3×3 · Phaser 3 · Weapon FX · Floating Damage</div><div id="campaign"></div><div class="layout"><div><div class="card"><h3>SELECT UNIT</h3><div id="picker" class="pick"></div><div class="counter">วางแล้ว <b id="cnt">0</b> / 6</div><div id="diff" class="diff"><button data-d="easy">EASY</button><button data-d="normal" class="on">NORMAL</button><button data-d="hard">HARD</button></div><div id="editBar" class="bar" style="display:none"><button id="btnRemove">✖ ลบยูนิตที่เลือก</button><button id="btnUlt" style="display:none">✨ ULTIMATE</button></div><button id="btnStart" class="btn">▶ เริ่มการต่อสู้</button><button id="btnRandom" class="btn ghost">🎲 สุ่มจัดทัพ</button><button id="btnClear" class="btn ghost">🗑 ล้างกระดาน</button><button id="btnAuto" class="btn ghost" style="display:none">🤖 ต่อสู้อัตโนมัติ: ปิด</button><button id="btnNext" class="btn ghost" style="display:none">➡️ ด่านถัดไป</button><button id="btnReset" class="btn ghost" style="display:none">🔄 เล่นใหม่</button></div><div class="card" style="margin-top:14px"><h3>BATTLE LOG</h3><div id="log"></div></div></div><div class="card"><div id="turnBox">โหมดจัดทัพ — เลือกยูนิตทางซ้าย แล้วคลิกช่อง</div><div id="stage"></div></div></div></div><script src="game.js"></script></body></html>
