<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Tactics — Turn-based Grid War</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
<style>
  :root{--bg:#0b0f1a;--panel:#161d2e;--line:#2b3448;--accent:#4da3ff;
        --red:#ff6b6b;--ok:#4ade80;--text:#e6ecf7;--muted:#8496b5}
  *{box-sizing:border-box}
  body{margin:0;padding:16px;background:
       radial-gradient(circle at 25% -10%,#1d2742 0%,var(--bg) 60%);
       color:var(--text);font-family:Kanit,Tahoma,sans-serif;image-rendering:pixelated}
  h1{font-family:"Press Start 2P";font-size:16px;margin:0 0 6px;color:var(--accent);
     text-shadow:0 3px 0 #10203a}
  .sub{color:var(--muted);font-size:12px;margin-bottom:14px}
  .wrap{max-width:1020px;margin:0 auto}
  .layout{display:grid;grid-template-columns:278px 1fr;gap:14px;align-items:start}
  @media(max-width:820px){.layout{grid-template-columns:1fr}}
  .card{background:var(--panel);border:3px solid var(--line);border-radius:4px;padding:12px;
        box-shadow:0 4px 0 #0a0e18}
  .card h3{font-family:"Press Start 2P";font-size:10px;margin:0 0 10px;color:var(--accent)}
  .pick{display:flex;flex-direction:column;gap:5px}
  .pick button{display:flex;gap:9px;align-items:center;text-align:left;cursor:pointer;
    background:#202a40;border:2px solid var(--line);border-radius:3px;padding:7px 9px;
    color:var(--text);font-family:Kanit}
  .pick button:hover{border-color:var(--accent)}
  .pick button.on{background:#23395a;border-color:var(--accent)}
  .nm{font-weight:600;font-size:13px}
  .ds{font-size:10px;color:var(--muted);line-height:1.4}
  .counter{margin:10px 0 4px;font-size:12px;color:var(--muted)}
  .counter b{color:var(--accent);font-size:15px}
  .diff{display:flex;gap:5px;margin:9px 0 3px}
  .diff button{flex:1;padding:7px 0;border:2px solid var(--line);background:#202a40;
    color:var(--muted);border-radius:3px;cursor:pointer;font-family:"Press Start 2P";font-size:8px}
  .diff button.on{border-color:var(--accent);color:var(--accent);background:#23395a}
  .btn{width:100%;padding:9px;border:none;border-radius:3px;cursor:pointer;margin-top:5px;
       font-family:Kanit;font-weight:600;font-size:13px;
       background:var(--accent);color:#04101f;box-shadow:0 3px 0 #1f5f9e}
  .btn.ghost{background:#2a3450;color:var(--text);box-shadow:0 3px 0 #161d2e}
  .btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
  .btn:active{transform:translateY(2px);box-shadow:none}
  #turnBox{font-size:13px;padding:9px 12px;background:#1d2b45;border:2px solid var(--line);
           border-radius:3px;margin-bottom:10px;min-height:40px}
  #stage{display:flex;justify-content:center}
  #log{height:190px;overflow-y:auto;background:#0c1120;border:2px solid var(--line);
       border-radius:3px;padding:9px;font-size:11px;line-height:1.75}
  #log .hl{color:var(--accent)} #log .dm{color:#ffb454} #log .ko{color:var(--red)}
  #log .ai{color:#c084fc}
  .bar{display:flex;gap:6px;margin-top:8px}
  .bar button{flex:1;padding:6px;border:2px solid var(--line);background:#2a3450;
              color:var(--text);border-radius:3px;cursor:pointer;font-family:Kanit;font-size:12px}
  .btn.on{background:var(--ok);color:#04150a;box-shadow:0 3px 0 #1b6e3f}
  .stageRow{margin-bottom:11px}
  .stageRow:last-child{margin-bottom:2px}
  .chapName{font-size:11px;color:var(--accent);margin-bottom:5px;font-weight:600}
  .chapName.locked{color:var(--muted)}
  .stageGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
  .stageGrid button{aspect-ratio:1;border:2px solid var(--line);background:#202a40;color:var(--muted);
    border-radius:3px;cursor:pointer;font-family:"Press Start 2P";font-size:9px;padding:0}
  .stageGrid button:not(:disabled):hover{border-color:var(--accent)}
  .stageGrid button.done{border-color:var(--ok);color:var(--ok)}
  .stageGrid button.boss{color:#ffb454}
  .stageGrid button.done.boss{color:var(--ok)}
  .stageGrid button.sel{background:#23395a;border-color:var(--accent);color:var(--accent)}
  .stageGrid button:disabled{opacity:.32;cursor:not-allowed}
</style>
</head>
<body>
<div class="wrap">
  <h1>PIXEL TACTICS</h1>
  <div class="sub">Turn-based 3×3 · Phaser 3 · Unique FX · Quick Move & Swap</div>
  <div class="layout">
    <div>
      <div class="card" style="margin-bottom:14px">
        <h3>โหมดเกม</h3>
        <div class="diff" id="modeSwitch">
          <button data-m="free" class="on">โหมดอิสระ</button>
          <button data-m="adventure">ผจญภัย</button>
        </div>
      </div>
      <div class="card" id="stageSelectCard" style="display:none;margin-bottom:14px">
        <h3>เลือกด่านผจญภัย</h3>
        <div id="stageSelectBody"></div>
      </div>
      <div class="card" style="margin-bottom:14px">
        <h3>SELECT UNIT</h3>
        <div id="stageInfo" style="display:none;font-size:11px;color:var(--muted);margin-bottom:8px;
             background:#1d2b45;border:2px solid var(--line);border-radius:3px;padding:6px 8px"></div>
        <div class="pick" id="picker"></div>
        <div class="counter">วางแล้ว <b id="cnt">0</b> / 6</div>
        <div class="diff" id="diff">
          <button data-d="easy">EASY</button>
          <button data-d="normal" class="on">NORMAL</button>
          <button data-d="hard">HARD</button>
        </div>
        <div class="bar" id="editBar" style="display:none">
          <button data-act="remove">✖ ลบยูนิตที่เลือก</button>
        </div>
        <button class="btn" id="btnStart">▶ เริ่มการต่อสู้</button>
        <button class="btn ghost" id="btnChangeStage" style="display:none">🗺 เปลี่ยนด่าน</button>
        <button class="btn ghost" id="btnRandom">🎲 สุ่มจัดทัพ</button>
        <button class="btn ghost" id="btnClear">🗑 ล้างกระดาน</button>
        <button class="btn ghost" id="btnAutoBattle" style="display:none">🤖 Auto Battle: OFF</button>
        <button class="btn" id="btnNextStage" style="display:none">➡ ด่านต่อไป</button>
        <button class="btn ghost" id="btnRetryStage" style="display:none">🔁 ลองด่านนี้อีกครั้ง</button>
        <button class="btn ghost" id="btnReset" style="display:none">🔄 เล่นใหม่</button>
      </div>
      <div class="card"><h3>BATTLE LOG</h3><div id="log"></div></div>
    </div>
    <div class="card">
      <div id="turnBox">โหมดจัดทัพ — เลือกยูนิตทางซ้าย หรือคลิกยูนิตที่วางแล้วเพื่อย้าย/สลับตำแหน่ง</div>
      <div id="stage"></div>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   1) CONFIG
   ═══════════════════════════════════════════════════════════ */
const GRID = 3, MAX_UNITS = 6, CELL = 88, GAP = 8, PAD = 16;
const TEAM = { player:'#4da3ff', bot:'#ff6b6b' };

/* ═══ Adventure Mode: 5 บท × 10 ด่าน (ด่านที่ 10 ของแต่ละบท = Boss 2×2) ═══ */
const STAGES_PER_CHAPTER = 10, CHAPTER_COUNT = 5;
const CHAPTERS = [
  {name:'ที่ราบเริ่มต้น',   boss:'หัวหน้าโจรป่า'},
  {name:'ป่าพิษเงามืด',     boss:'แมงมุมยักษ์จอมพิษ'},
  {name:'ทะเลทรายเพลิง',   boss:'ปีศาจเพลิงทะเลทราย'},
  {name:'ยอดเขาน้ำแข็ง',   boss:'มังกรน้ำแข็งโบราณ'},
  {name:'ปราสาทมืด',       boss:'จอมมารราชาปราสาทมืด'},
];
const BOSS_WEAPON_BY_CHAPTER = ['axe','spear','gun','cannon','sword'];

function loadProgress(){
  try{
    const raw = localStorage.getItem('pixelTactics_campaign_v1');
    if(raw){ const p = JSON.parse(raw); if(p && p.unlocked && p.cleared) return p; }
  }catch(e){}
  return { unlocked:{1:1,2:0,3:0,4:0,5:0}, cleared:{} };
}
function saveProgress(){
  try{ localStorage.setItem('pixelTactics_campaign_v1', JSON.stringify(campaignProgress)); }catch(e){}
}
let campaignProgress = loadProgress();

const BODY = [
"................",
".....111111.....",
"....11222211....",
"....12222221....",
"....14444441....",
"....14144141....",
"....14444441....",
"....15444451....",
"...1222222221...",
"..141222222141..",
"..141222222141..",
"...1322222231...",
"...1222222221...",
"....18811881....",
"....18811881....",
"...18881.18881.."
];

/* ปรับแต่งดีไซน์อาวุธ: ขวานสีแดง (R) และปืนไรเฟิลยาวขึ้น (gun) */
const WEAPONS = {
  sword : ["..66..","..66..","..66..","..66..","..66..","..66..",".9999.","..77..","..77..","......","......","......"],
  spear : ["..6...",".666..",".666..","..7...","..7...","..7...","..7...","..7...","..7...","..7...","..7...","..7..."],
  gun   : ["......",".......6","......66","...11111","..777771","...777..","....77..","....7...","....7...","........","........","........"],
  bow   : ["..6...",".6.9..",".6..9.","6...9.","6...9.","6...9.",".6..9.",".6.9..","..6...","......","......","......"],
  cannon: ["......","......",".1111.",".6666.",".6666.",".1111.","..88..",".8888.",".8888.",".8888.",".8888.","......"],
  axe   : ["......","....RR","...RRR","..RRRR",".RRRRR","...RRR","....77",".....7",".....7",".....7",".....7",".....7"],
  priest: ["..9...",".999..","..9...","..9...","..7...","..7...","..7...","..7...","..7...","..7...","..7...","......"],
};

/* ═══════════════════════════════════════════════════════════
   2) STATE + HELPERS
   ═══════════════════════════════════════════════════════════ */
const newGrid = () => Array.from({length:GRID},()=>Array(GRID).fill(null));
const S = { phase:'deploy', turn:'player', busy:false, ai:'normal',
            g:{player:newGrid(),bot:newGrid()}, v:{player:newGrid(),bot:newGrid()},
            pick:null, selected:null, attacker:null,
            mode:'free', campaign:null, autoBattle:false };

const $     = id => document.getElementById(id);
const inB   = (r,c) => r>=0&&r<GRID&&c>=0&&c<GRID;
const coord = (r,c) => String.fromCharCode(65+c)+(r+1);
const alive = s => S.g[s].flat().filter(u=>u&&u.hp>0);
const count = s => S.g[s].flat().filter(Boolean).length;
const wait  = ms => new Promise(res=>setTimeout(res,ms));

function shade(hex,amt){
  const n=parseInt(hex.slice(1),16), cl=v=>Math.max(0,Math.min(255,v));
  return '#'+[(n>>16)+amt,((n>>8)&255)+amt,(n&255)+amt]
              .map(v=>cl(v).toString(16).padStart(2,'0')).join('');
}

function frontOrder(side){
  const rows = [...Array(GRID).keys()];
  return side==='bot' ? rows.reverse() : rows;
}

function pierceColumn(side, c, ratios){
  const line = frontOrder(side)
    .filter(r => { const u = S.g[side][r][c]; return u && u.hp > 0; });
  return ratios
    .map((ratio,i) => line[i]===undefined ? null : {r:line[i], c, ratio})
    .filter(Boolean);
}

function spearTargets(side,c){
  const rows=frontOrder(side);
  const i=rows.findIndex(r=>{const u=S.g[side][r][c];return u&&u.hp>0;});
  if(i<0)return [];
  const hits=[{r:rows[i],c,ratio:1.00}];
  const next=rows[i+1];
  if(next!==undefined && S.g[side][next][c] && S.g[side][next][c].hp>0) hits.push({r:next,c,ratio:0.50});
  return hits;
}

function rowTargets(side,r){
  const rows=frontOrder(side);
  const activeRow=rows.find(rr=>S.g[side][rr].some(u=>u&&u.hp>0));
  if(activeRow===undefined || r!==activeRow) return [];
  return [0,1,2].map(c=>({r:activeRow,c,ratio:1.00}));
}

const UNIT_TYPES = {
  sword : { name:'ดาบ', icon:'⚔', role:'MELEE', hp:140, atk:48, crit:0.12, ds:'ประชิด: ตัวหน้าสุดในคอลัมน์ (100%)', targets:(r,c,side)=>pierceColumn(side,c,[1.00]) },
  spear : { name:'หอก', icon:'⟶', role:'PIERCE', hp:115, atk:40, crit:0.10, ds:'แทง: ตัวหน้า + ตัวถัดไปที่ติดกันเท่านั้น (100% / 50%)', targets:(r,c,side)=>spearTargets(side,c) },
  gun   : { name:'ปืน', icon:'▰', role:'RIFLE', hp:95, atk:34, crit:0.15, ds:'ยิงทะลุคอลัมน์ 100 / 60 / 30%', targets:(r,c,side)=>pierceColumn(side,c,[1.00,0.60,0.30]) },
  bow   : { name:'ธนู', icon:'➶', role:'RANGED', hp:75, atk:56, crit:0.20, ds:'เล็งช่องใดก็ได้ (100%)', targets:(r,c)=>[{r,c,ratio:1.00}] },
  cannon: { name:'ปืนใหญ่', icon:'✹', role:'BLAST', hp:60, atk:44, crit:0.10, ds:'กากบาท: กลาง 90% + รอบข้าง 55%', targets:(r,c)=>[{r,c,ratio:0.90}, ...[[-1,0],[1,0],[0,-1],[0,1]].map(([a,b])=>({r:r+a,c:c+b,ratio:0.55}))] },
  axe   : { name:'ขวาน', icon:'🪓', role:'ROW', hp:110, atk:30, crit:0.12, ds:'ฟันแถว: โจมตีแนวนอน 3 ช่อง · ห้ามข้ามแนวหน้า', targets:(r,c,side)=>rowTargets(side,r) },
  priest: { name:'นักบวช', icon:'🙏', role:'SUPPORT', hp:70, atk:20, crit:0.05,
            ds:'สวดมนต์: โจมตีช่องใดก็ได้ (ดาเมจต่ำ) · คลิกพันธมิตรเพื่อฮีล',
            canHeal:true, healRatio:1.6, // ฮีลปกติ = atk * healRatio
            targets:(r,c)=>[{r,c,ratio:1.00}] } // โจมตีปกติ: เลือกเป้าใดก็ได้เหมือนธนู
};
const ORDER  = ['sword','spear','gun','bow','cannon','axe','priest'];
const MELEE  = ['sword','spear'];
const COLUMN_WEAPONS = ['sword','spear','gun'];
const mkUnit = (t, mult=1) => {
  const T = UNIT_TYPES[t];
  const hp = Math.round(T.hp*mult);
  return mult===1 ? {type:t, hp, max:hp} : {type:t, hp, max:hp, atk:Math.round(T.atk*mult)};
};
function makeBoss(chapter){
  const idx = chapter-1;
  const type = BOSS_WEAPON_BY_CHAPTER[idx % BOSS_WEAPON_BY_CHAPTER.length];
  const T = UNIT_TYPES[type];
  const hpMult  = 5 + idx*1.6;
  const atkMult = 1.7 + idx*0.4;
  const hp = Math.round(T.hp*hpMult);
  return { type, isBoss:true, size:2, hp, max:hp,
           atk: Math.round(T.atk*atkMult),
           crit: Math.min(0.35, (T.crit||0) + 0.04*idx) };
}

/* ═══════════════════════════════════════════════════════════
   3) CORE — คำนวณดาเมจ
   ═══════════════════════════════════════════════════════════ */
function calculateDamage(unit, tr, tc, foeSide){
  const T = UNIT_TYPES[unit.type];
  const atk  = unit.atk  != null ? unit.atk  : T.atk;
  const crit = unit.crit != null ? unit.crit : T.crit;
  return T.targets(tr,tc,foeSide).filter(h=>inB(h.r,h.c)).map(h=>{
    const critical=Math.random()<(crit||0);
    const variance=0.85+Math.random()*0.30;
    const base=Math.max(1,Math.round(atk*h.ratio*variance));
    return {r:h.r,c:h.c,ratio:h.ratio,damage:critical?Math.round(base*1.5):base,critical};
  });
}

/* ═══════════════════════════════════════════════════════════
   4) PIXEL ART GENERATOR
   ═══════════════════════════════════════════════════════════ */
function paletteFor(armor){
  return {'1':'#141824','2':armor,'3':shade(armor,-45),'4':'#f2c48d','5':'#d49b6a',
          '6':'#cfd8e6','7':'#8a5a2b','8':'#39405a','9':'#ffd166','R':'#ff3333'};
}
function drawMap(ctx,map,pal,px,ox,oy){
  map.forEach((row,y)=>[...row].forEach((ch,x)=>{
    const col = pal[ch]; if(!col) return;
    ctx.fillStyle = col; ctx.fillRect((ox+x)*px,(oy+y)*px,px,px);
  }));
}
function paintUnit(ctx,type,armor,px){
  const pal = paletteFor(armor);
  drawMap(ctx, BODY, pal, px, 2, 1);
  drawMap(ctx, WEAPONS[type], pal, px, 13, 3);
}
function makeUnitTexture(scene,key,type,armor){
  const PX=3, t = scene.textures.createCanvas(key, 20*PX, 18*PX);
  paintUnit(t.getContext(), type, armor, PX); t.refresh();
}
function makeTileTexture(scene){
  const t = scene.textures.createCanvas('tile', CELL, CELL), x = t.getContext();
  x.fillStyle='#808080'; x.fillRect(0,0,CELL,CELL);
  x.fillStyle='#ffffff'; x.fillRect(0,0,CELL,4); x.fillRect(0,CELL-4,CELL,4);
  x.fillRect(0,0,4,CELL); x.fillRect(CELL-4,0,4,CELL);
  x.fillStyle='#c8c8c8';
  [[6,6],[CELL-14,6],[6,CELL-14],[CELL-14,CELL-14]].forEach(([a,b])=>x.fillRect(a,b,8,8));
  t.refresh();
}
function makeDotTexture(scene){
  const t = scene.textures.createCanvas('dot',8,8), x=t.getContext();
  x.fillStyle='#ffffff'; x.fillRect(2,0,4,8); x.fillRect(0,2,8,4); t.refresh();
}

/* ═══════════════════════════════════════════════════════════
   5) PHASER SCENE
   ═══════════════════════════════════════════════════════════ */
const BOARD_W = 3*CELL + 2*GAP;
const TOP_Y = 40, BOT_Y = TOP_Y + BOARD_W + 62;
const W = BOARD_W + PAD*2, H = BOT_Y + BOARD_W + PAD + 6;
let scene = null;
const cellX = c => PAD + c*(CELL+GAP) + CELL/2;
const cellY = (side,r) => (side==='bot'?TOP_Y:BOT_Y) + r*(CELL+GAP) + CELL/2;

class Battle extends Phaser.Scene{
  create(){
    scene = this;
    makeTileTexture(this); makeDotTexture(this);
    ORDER.forEach(t=>{
      makeUnitTexture(this,`u_${t}_player`,t,TEAM.player);
      makeUnitTexture(this,`u_${t}_bot`,   t,TEAM.bot);
    });
    this.tiles = { player:newGrid(), bot:newGrid() };

    ['bot','player'].forEach(side=>{
      const baseY = side==='bot'?TOP_Y:BOT_Y;
      this.add.text(PAD, baseY-24, side==='bot'?'ENEMY ARMY':'YOUR ARMY',
        {fontFamily:'"Press Start 2P"',fontSize:'11px',
         color:side==='bot'?'#ff6b6b':'#4da3ff'});
      for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++){
        const x=cellX(c), y=cellY(side,r);
        this.tiles[side][r][c] = this.add.image(x,y,'tile').setTint(0x1e2740);
        this.add.text(x-CELL/2+9, y-CELL/2+9, coord(r,c),
          {fontFamily:'"Press Start 2P"',fontSize:'8px',color:'#5a6b8f'});
        if((side==='bot'&&r===GRID-1)||(side==='player'&&r===0))
          this.add.text(x, baseY + r*(CELL+GAP) + CELL - 11, '▲ FRONT',
            {fontFamily:'"Press Start 2P"',fontSize:'6px',color:'#6b7ea8'}).setOrigin(.5);
        const z = this.add.zone(x,y,CELL,CELL).setInteractive();
        z.on('pointerdown', ()=>onCellClick(side,r,c));
        z.on('pointerover', ()=>onCellHover(side,r,c));
        z.on('pointerout',  ()=>clearPreview());
      }
    });
    renderAll();
  }
}

new Phaser.Game({
  type:Phaser.AUTO, parent:'stage', width:W, height:H,
  backgroundColor:'#0d1322', pixelArt:true, roundPixels:true,
  scale:{ mode:Phaser.Scale.FIT, autoCenter:Phaser.Scale.CENTER_HORIZONTALLY },
  scene:[Battle]
});

/* ═══════════════════════════════════════════════════════════
   6) UNIT VIEW (เอาไอคอนเหนือกหัวออกแล้ว)
   ═══════════════════════════════════════════════════════════ */
function createView(side,r,c,unit){
  const x = cellX(c), y = cellY(side,r);
  const co = scene.add.container(x, y);
  const shadow = scene.add.ellipse(0,26,44,12,0x000000,.35);
  const spr = scene.add.image(0,0,`u_${unit.type}_${side}`).setScale(1.1);
  if(side==='bot') spr.setFlipX(true);
  const bg  = scene.add.rectangle(0,34,54,7,0x000000).setStrokeStyle(2,0x141824);
  const bar = scene.add.rectangle(-25,34,50,3,0x4ade80).setOrigin(0,.5);
  const hpTxt = scene.add.text(0,-30,`${unit.hp}`,
    {fontFamily:'"Press Start 2P"',fontSize:'10px',color:'#4ade80',
     stroke:'#000',strokeThickness:4}).setOrigin(.5);
  const role=scene.add.text(0,43,UNIT_TYPES[unit.type].role,{fontFamily:'"Press Start 2P"',fontSize:'5px',color:'#dbe7ff',stroke:'#000',strokeThickness:3}).setOrigin(.5);
  
  co.add([shadow,spr,bg,bar,hpTxt,role]);
  co.spr=spr; co.bar=bar; co.hpTxt=hpTxt; co.role=role;
  co.homeX=x; co.homeY=y; co.barWidth=50;
  scene.tweens.add({targets:spr, y:{from:0,to:-4}, duration:900+Math.random()*400,
                    yoyo:true, repeat:-1, ease:'Sine.easeInOut'});
  co.setScale(0); scene.tweens.add({targets:co, scale:1, duration:260, ease:'Back.easeOut'});
  S.v[side][r][c] = co;
  return co;
}

/* บอส 2×2: กินพื้นที่ 4 ช่อง (ar,ac) ถึง (ar+1,ac+1) แชร์ออบเจ็กต์ยูนิตและวิวเดียวกันในทุกช่อง */
function createBossView(side,ar,ac,unit){
  const cx = (cellX(ac)+cellX(ac+1))/2, cy = (cellY(side,ar)+cellY(side,ar+1))/2;
  const co = scene.add.container(cx, cy);
  const glow = scene.add.circle(0,4,58,0xff3355,0.16);
  scene.tweens.add({targets:glow, scale:{from:0.92,to:1.18}, duration:950, yoyo:true, repeat:-1, ease:'Sine.easeInOut'});
  const shadow = scene.add.ellipse(0,58,96,20,0x000000,.4);
  const spr = scene.add.image(0,0,`u_${unit.type}_${side}`).setScale(2.3);
  if(side==='bot') spr.setFlipX(true);
  const bg  = scene.add.rectangle(0,74,112,10,0x000000).setStrokeStyle(2,0x141824);
  const bar = scene.add.rectangle(-54,74,108,6,0xff5a5a).setOrigin(0,.5);
  const hpTxt = scene.add.text(0,-66,`${unit.hp}`,
    {fontFamily:'"Press Start 2P"',fontSize:'13px',color:'#ff5a5a',
     stroke:'#000',strokeThickness:5}).setOrigin(.5);
  const role=scene.add.text(0,88,'☠ BOSS',{fontFamily:'"Press Start 2P"',fontSize:'9px',color:'#ffd166',stroke:'#000',strokeThickness:3}).setOrigin(.5);

  co.add([glow,shadow,spr,bg,bar,hpTxt,role]);
  co.spr=spr; co.bar=bar; co.hpTxt=hpTxt; co.role=role;
  co.homeX=cx; co.homeY=cy; co.barWidth=108;
  scene.tweens.add({targets:spr, y:{from:0,to:-6}, duration:1100, yoyo:true, repeat:-1, ease:'Sine.easeInOut'});
  co.setScale(0); scene.tweens.add({targets:co, scale:1, duration:380, ease:'Back.easeOut'});
  for(let dr=0;dr<2;dr++) for(let dc=0;dc<2;dc++) S.v[side][ar+dr][ac+dc] = co;
  return co;
}

function updateHp(side,r,c){
  const u=S.g[side][r][c], v=S.v[side][r][c]; if(!u||!v) return;
  const p = u.hp/u.max;
  const full = v.barWidth || 50;
  v.bar.width = Math.max(0, full*p);
  const hex = p>.5 ? 0x4ade80 : p>.25 ? 0xfacc15 : 0xff5a5a;
  v.bar.fillColor = hex;
  v.hpTxt.setText(`${u.hp}`);
  v.hpTxt.setColor('#'+hex.toString(16).padStart(6,'0'));
}

function destroyView(side,r,c){
  const v=S.v[side][r][c]; if(v) v.destroy();
  S.v[side][r][c]=null;
}

/* ═══════════════════════════════════════════════════════════
   7) FX & ANIMATIONS (ปรับปรุงใหม่ตามอาวุธ)
   ═══════════════════════════════════════════════════════════ */
function burst(x,y,colors,n){
  const p = scene.add.particles(x,y,'dot',{
    speed:{min:60,max:200}, lifespan:520, scale:{start:2.5,end:0},
    quantity:1, tint:colors, emitting:false, gravityY:180 });
  p.setDepth(96); p.explode(n); scene.time.delayedCall(900,()=>p.destroy());
}

function healFX(x,y){
  const p = scene.add.particles(x,y,'dot',{
    speed:{min:30,max:90}, lifespan:700, scale:{start:2,end:0},
    quantity:1, tint:[0x4ade80,0xffffff,0xbff7d0], emitting:false, gravityY:-70 });
  p.setDepth(96); p.explode(16); scene.time.delayedCall(900,()=>p.destroy());
  const ring = scene.add.circle(x,y,6,0x4ade80,0).setStrokeStyle(3,0x4ade80).setDepth(95);
  scene.tweens.add({targets:ring, radius:34, alpha:0, duration:520, onComplete:()=>ring.destroy()});
}

/* ขยายขนาดเลข Damage ให้ใหญ่เด่นชัด */
function popText(x,y,txt,color,isCrit){
  const fontSize = isCrit ? '22px' : '17px';
  const t = scene.add.text(x,y-10,txt,
    {fontFamily:'"Press Start 2P"',fontSize:fontSize,color:color,stroke:'#000',strokeThickness:5})
    .setOrigin(.5).setDepth(99);
  
  scene.tweens.add({
    targets:t, y:y-65, scale:{from:0.5, to:isCrit?1.4:1.1}, alpha:0, duration:950,
    ease:'Back.easeOut', onComplete:()=>t.destroy()
  });
}

function shakeUnit(v){
  scene.tweens.add({targets:v, x:v.x+6, duration:45, yoyo:true, repeat:3});
  v.spr.setTintFill(0xffffff);
  scene.time.delayedCall(90,()=>{ if(v.spr) v.spr.clearTint(); });
}

/* Rifle Effect: Muzzle Flash & Rifle Fire Line */
async function fireRifleFX(x1,y1,x2,y2){
  // Flash หน้ากระบอกปืน
  const flash = scene.add.ellipse(x1, y1, 24, 24, 0xffea00).setDepth(95);
  scene.tweens.add({targets:flash, alpha:0, scale:2, duration:100, onComplete:()=>flash.destroy()});
  
  // Smoke
  burst(x1, y1, [0xaaaaaa, 0x666666], 6);

  // Tracer Bullet
  const line = scene.add.line(0, 0, x1, y1, x2, y2, 0xfff59d).setLineWidth(3).setDepth(90).setOrigin(0);
  scene.tweens.add({targets:line, alpha:0, duration:150, onComplete:()=>line.destroy()});
  await wait(100);
}

/* Thrust FX สำหรับหอก */
function spearThrustFX(x,y){
  const thrust = scene.add.rectangle(x, y, 12, 90, 0xffffff).setDepth(95);
  scene.tweens.add({targets:thrust, scaleX:0, alpha:0, duration:200, onComplete:()=>thrust.destroy()});
  burst(x,y,[0xffffff,0x4da3ff],12);
}

/* Slash FX สำหรับดาบ */
function slashFX(x,y){
  const s1 = scene.add.rectangle(x,y, 80, 8, 0xffffff).setAngle(-45).setDepth(95);
  const s2 = scene.add.rectangle(x,y, 80, 8, 0xffffff).setAngle(45).setDepth(95);
  scene.tweens.add({targets:[s1,s2], alpha:0, scaleX:1.4, duration:200, onComplete:()=>{s1.destroy();s2.destroy();}});
  burst(x,y,[0xffffff,0xffd166], 14);
}

function rowSlashFX(side,row){
  const y=cellY(side,row), left=cellX(0)-CELL*.45, right=cellX(2)+CELL*.45;
  const sweep=scene.add.rectangle(left,y,right-left,12,0xff3333).setOrigin(0,.5).setDepth(96);
  scene.tweens.add({targets:sweep,x:right,alpha:0,scaleY:2,duration:300,ease:'Cubic.easeOut',onComplete:()=>sweep.destroy()});
  [0,1,2].forEach((c,i)=>{
    const x=cellX(c);
    burst(x,y,[0xff3333,0xffd166,0xffffff],12);
  });
  scene.cameras.main.shake(200,.008);
}

/* ═══════════════════════════════════════════════════════════
   8) DAMAGE APPLICATION
   ═══════════════════════════════════════════════════════════ */
async function applyDamage(side, hits){
  for(const h of hits){
    const u = S.g[side][h.r][h.c];
    if(!u || u.hp<=0){
      burst(cellX(h.c), cellY(side,h.r), [0x8fa0bd], 6);
      log(`   → ${coord(h.r,h.c)} ไม่มีเป้าหมาย`); continue;
    }
    u.hp = Math.max(0, u.hp - h.damage);
    const v = S.v[side][h.r][h.c];
    shakeUnit(v); updateHp(side,h.r,h.c);
    popText(v.x, v.y, `${h.critical ? 'CRIT! ' : ''}-${h.damage}`,
            h.critical ? '#ffd166' : '#ff5a5a', h.critical);
    burst(v.x, v.y, h.critical ? [0xffffff,0xffd166,0xff5a5a] : [0xffd166,0xff5a5a],
          h.critical ? 22 : 12);
    if(h.critical) scene.cameras.main.shake(140,.007);
    log(`   → ${UNIT_TYPES[u.type].name} (${coord(h.r,h.c)}) ${h.critical ? 'CRITICAL! ' : ''}รับ ${h.damage} dmg · เหลือ ${u.hp} HP`,
        h.critical ? 'hl' : 'dm');
    if(u.hp===0){
      log(`   💀 ${UNIT_TYPES[u.type].name} (${coord(h.r,h.c)}) ถูกทำลาย!`,'ko');
      burst(v.x, v.y, [0xffffff,0xffd166,0xff5a5a], u.isBoss ? 46 : 28);
      scene.cameras.main.shake(u.isBoss ? 260 : 180, u.isBoss ? .014 : .008);
      if(u.isBoss){
        for(let rr=0; rr<GRID; rr++) for(let cc=0; cc<GRID; cc++){
          if(S.g[side][rr][cc]===u){ S.g[side][rr][cc]=null; S.v[side][rr][cc]=null; }
        }
      }else{
        S.g[side][h.r][h.c] = null;
        S.v[side][h.r][h.c] = null;
      }
      scene.tweens.add({targets:v, alpha:0, scale:1.6, angle:25, duration:420,
        onComplete:()=>v.destroy()});
    }
    await wait(140);
  }
}

/* ═══════════════════════════════════════════════════════════
   9) PREVIEW & HIGHLIGHT
   ═══════════════════════════════════════════════════════════ */
let previewTexts = [];
function renderTiles(){
  ['player','bot'].forEach(side=>{
    for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++){
      let tint = 0x1e2740;
      if(side==='player' && S.selected && S.selected.r===r && S.selected.c===c) tint=0x2f6fbf;
      if(side==='player' && S.attacker && S.attacker.r===r && S.attacker.c===c) tint=0x2f6fbf;
      scene.tiles[side][r][c].setTint(tint);
    }
  });
}
function clearPreview(){
  previewTexts.forEach(t=>t.destroy()); previewTexts=[];
  renderTiles();
}
function onCellHover(side,r,c){
  if(!S.attacker || S.phase!=='battle' || S.turn!=='player' || S.busy) return;
  const u = S.g.player[S.attacker.r][S.attacker.c]; if(!u) return;

  if(side==='player'){
    clearPreview();
    if(!UNIT_TYPES[u.type].canHeal) return;
    const target = S.g.player[r][c];
    if(target && target.hp>0){
      scene.tiles.player[r][c].setTint(target.hp<target.max ? 0x2f7a52 : 0x394a3f);
      previewTexts.push(scene.add.text(cellX(c), cellY('player',r),
        target.hp<target.max ? 'HEAL' : 'FULL',
        {fontFamily:'"Press Start 2P"',fontSize:'8px',color:target.hp<target.max?'#4ade80':'#8496b5'})
        .setOrigin(.5).setDepth(50));
    }
    return;
  }
  if(side!=='bot') return;
  clearPreview();

  if(COLUMN_WEAPONS.includes(u.type))
    for(let rr=0; rr<GRID; rr++) scene.tiles.bot[rr][c].setTint(0x3b3050);

  if(u.type==='axe'){
    const activeRow=frontOrder('bot').find(rr=>S.g.bot[rr].some(t=>t&&t.hp>0));
    if(activeRow!==undefined){
      for(let cc=0;cc<GRID;cc++) scene.tiles.bot[activeRow][cc].setTint(0x5a3340);
      if(r!==activeRow){
        previewTexts.push(scene.add.text(cellX(1),cellY('bot',r),'LOCKED',{fontFamily:'"Press Start 2P"',fontSize:'8px',color:'#8496b5'}).setOrigin(.5).setDepth(50));
        return;
      }
    }
  }

  const hits = calculateDamage(u, r, c, 'bot');
  if(!hits.length){
    previewTexts.push(scene.add.text(cellX(c), cellY('bot',r), 'MISS',
      {fontFamily:'"Press Start 2P"',fontSize:'9px',color:'#8496b5'})
      .setOrigin(.5).setDepth(50));
    return;
  }
  hits.forEach((h,i)=>{
    scene.tiles.bot[h.r][h.c].setTint(i===0 ? 0xa33546 : 0x7a2b3a);
  });
}

/* ═══════════════════════════════════════════════════════════
   10) INPUT (ปรับระบบย้าย/สลับตำแหน่งให้คลิกแล้วทำงานทันที)
   ═══════════════════════════════════════════════════════════ */
function onCellClick(side,r,c){
  if(S.busy || S.phase==='over') return;
  if(S.phase==='deploy'){ if(side==='player') deployClick(r,c); return; }
  if(S.turn!=='player') return;

  if(side==='player'){
    if(S.attacker){
      const healer = S.g.player[S.attacker.r][S.attacker.c];
      if(healer && healer.hp>0 && UNIT_TYPES[healer.type].canHeal){
        if(S.attacker.r===r && S.attacker.c===c){
          if(healer.hp<healer.max){
            runHeal('player', S.attacker, r, c);
          }else{
            S.attacker=null; renderTiles();
            setTurn('🟢 เทิร์นของคุณ — คลิกยูนิตของคุณเพื่อโจมตี/ฮีล');
          }
          return;
        }
        const target=S.g.player[r][c];
        if(!target||target.hp<=0) return setTurn('⚠️ ไม่มีพันธมิตรอยู่ที่ช่องนี้');
        if(target.hp>=target.max) return setTurn('⚠️ พันธมิตรคนนี้ HP เต็มแล้ว');
        runHeal('player', S.attacker, r, c);
        return;
      }
    }
    const u=S.g.player[r][c];
    if(!u||u.hp<=0) return setTurn('⚠️ เลือกยูนิตของคุณที่ยังมีชีวิตอยู่');
    S.attacker={r,c}; renderTiles();
    setTurn(`🎯 ${UNIT_TYPES[u.type].name} (${coord(r,c)}) — ${UNIT_TYPES[u.type].ds}`);
  }else{
    if(!S.attacker) return setTurn('⚠️ เลือกยูนิตของคุณก่อน');
    const attacker=S.g.player[S.attacker.r][S.attacker.c];
    if(attacker && (attacker.type==='axe')){
      const activeRow=frontOrder('bot').find(rr=>S.g.bot[rr].some(t=>t&&t.hp>0));
      if(activeRow===undefined) return setTurn('⚠️ ไม่มีเป้าหมาย');
      if(r!==activeRow){
        setTurn(`🔒 ${UNIT_TYPES[attacker.type].name} โจมตีได้เฉพาะแถวหน้าสุดที่ยังมีศัตรู`);
        return;
      }
    }
    runAttack('player', S.attacker, r, c);
  }
}

function deployClick(r,c){
  const g=S.g.player;

  // 1. ถ้ามียูนิตที่เลือกอยู่แล้ว และคลิกตำแหน่งใหม่ -> ทำการ ย้าย หรือ สลับ
  if(S.selected){
    const {r:sr, c:sc} = S.selected;
    
    // ถ้าคลิกตัวเดิม ให้ยกเลิกการเลือก
    if(sr===r && sc===c){
      S.selected = null;
      setTurn('โหมดจัดทัพ — เลือกยูนิตทางซ้าย หรือคลิกยูนิตเพื่อย้าย/สลับ');
      return renderAll();
    }

    // ย้าย/สลับ ข้อมูล
    const srcUnit = g[sr][sc];
    const targetUnit = g[r][c];
    const srcView = S.v.player[sr][sc];
    const targetView = S.v.player[r][c];

    g[r][c] = srcUnit;
    g[sr][sc] = targetUnit;
    S.v.player[r][c] = srcView;
    S.v.player[sr][sc] = targetView;

    // เล่น Animation เคลื่อนย้าย
    if(srcView) scene.tweens.add({targets:srcView, x:cellX(c), y:cellY('player',r), duration:200, ease:'Quad.easeOut'});
    if(targetView) scene.tweens.add({targets:targetView, x:cellX(sc), y:cellY('player',sr), duration:200, ease:'Quad.easeOut'});

    log(targetUnit ? `↔ สลับ ${coord(sr,sc)} ↔ ${coord(r,c)}` : `↔ ย้าย ${coord(sr,sc)} → ${coord(r,c)}`);
    S.selected = null;
    setTurn('โหมดจัดทัพ — เลือกยูนิตทางซ้าย หรือคลิกยูนิตเพื่อย้าย/สลับ');
    return renderAll();
  }

  // 2. ถ้าคลิกช่องที่มีตัวละครอยู่แล้ว -> เลือกตัวนั้นเตรียมย้าย/สลับ
  if(g[r][c]){
    S.selected = {r,c};
    S.pick = null;
    setTurn(`📍 เลือก ${UNIT_TYPES[g[r][c].type].name} (${coord(r,c)}) — คลิกช่องอื่นเพื่อย้าย/สลับ หรือกดลบ`);
    return renderAll();
  }

  // 3. วางยูนิตใหม่จาก Picker
  if(!S.pick) return setTurn('⚠️ เลือกชนิดยูนิตทางซ้ายก่อน หรือคลิกตัวละครที่วางแล้วเพื่อย้าย');
  if(count('player')>=MAX_UNITS) return setTurn(`⚠️ วางได้สูงสุด ${MAX_UNITS} ตัว`);
  
  g[r][c] = mkUnit(S.pick); 
  createView('player',r,c,g[r][c]);
  log(`✅ วาง ${UNIT_TYPES[S.pick].name} ที่ ${coord(r,c)}`);
  renderAll();
}

/* ═══════════════════════════════════════════════════════════
   11) BATTLE FLOW
   ═══════════════════════════════════════════════════════════ */
const tweenTo = (t,x,y,d,ease='Cubic.easeInOut') => new Promise(done=>
  scene.tweens.add({targets:t, x, y, duration:d, ease, onComplete:done}));

async function runAttack(side, from, tr, tc){
  S.busy = true; S.attacker = null; clearPreview();
  const u = S.g[side][from.r][from.c]; if(!u){ S.busy=false; return; }
  const T   = UNIT_TYPES[u.type];
  const foe = side==='player' ? 'bot' : 'player';
  const who = side==='player' ? '[คุณ]' : '[บอท]';
  const v   = S.v[side][from.r][from.c];

  const hits = calculateDamage(u, tr, tc, foe);
  const aim  = hits[0] || { r:tr, c:tc };
  const homeX = v.homeX!==undefined ? v.homeX : cellX(from.c);
  const homeY = v.homeY!==undefined ? v.homeY : cellY(side, from.r);

  log(`${who} ${T.name} (${coord(from.r,from.c)}) → โจมตี ${coord(aim.r,aim.c)}`,'hl');
  setTurn(`${who} ${T.name} กำลังโจมตี ${coord(aim.r,aim.c)}...`);

  const strike = async ()=>{
    if(!hits.length){
      log('   → คอลัมน์ว่างเปล่า — โจมตีพลาด!','dm');
      popText(cellX(tc), cellY(foe,tr), 'MISS', '#8496b5', false);
    }
    await applyDamage(foe, hits);
  };

  if(u.type==='axe'){
    v.setDepth(80);
    const rowY=cellY(foe,aim.r);
    const sweepLeft=cellX(0)-CELL*.58;
    const sweepRight=cellX(2)+CELL*.58;
    const dir=side==='player' ? 1 : -1;
    const startX=dir===1 ? sweepLeft : sweepRight;
    const endX=dir===1 ? sweepRight : sweepLeft;

    await tweenTo(v,startX,rowY,220,'Cubic.easeOut');
    v.spr.setFlipX(side==='bot');
    scene.tweens.add({targets:v.spr,angle:{from:0,to:side==='player'?-12:12},duration:80,yoyo:true});
    await tweenTo(v,endX,rowY,520,'Cubic.easeInOut');
    rowSlashFX(foe,aim.r);
    await wait(110);
    await strike();
    await wait(140);
    await tweenTo(v,homeX,homeY,360,'Cubic.easeOut');
    v.setDepth(0);
  } else if(MELEE.includes(u.type)){
    v.setDepth(80);
    const stopY = cellY(foe, aim.r) + (side==='player' ? CELL*0.52 : -CELL*0.52);
    await tweenTo(v,cellX(aim.c),stopY,300,'Cubic.easeIn');
    
    if(u.type==='spear'){
      spearThrustFX(cellX(aim.c), cellY(foe, aim.r));
    } else {
      slashFX(cellX(aim.c), cellY(foe, aim.r));
    }
    
    scene.cameras.main.shake(130,.005);
    await wait(170);
    await strike();
    await wait(140);
    await tweenTo(v,homeX,homeY,340,'Cubic.easeOut');
    v.setDepth(0);
  } else if(u.type==='gun'){
    // ปืนไรเฟิล Effect ยิงทะลวง
    const dir = side==='player' ? -1 : 1;
    scene.tweens.add({targets:v, y:homeY+dir*10, duration:80, yoyo:true});
    await fireRifleFX(v.x, v.y, cellX(aim.c), cellY(foe, aim.r));
    await strike();
  } else {
    // ธนู / ปืนใหญ่
    const dir = side==='player' ? -1 : 1;
    scene.tweens.add({targets:v, y:homeY+dir*14, duration:110, yoyo:true, ease:'Quad.easeOut'});
    await wait(150);
    
    const pX = cellX(aim.c), pY = cellY(foe, aim.r);
    const proj = scene.add.image(v.x, v.y, 'dot').setScale(2.5).setTint(u.type==='cannon'?0xffd166:0xcfd8e6).setDepth(90);
    await tweenTo(proj, pX, pY, 260, 'Quad.easeIn');
    proj.destroy();

    if(u.type==='cannon'){
      burst(pX, pY, [0xff5a5a, 0xffd166, 0xffffff], 24);
      scene.cameras.main.shake(220,.009);
    } else {
      burst(pX, pY, [0xffffff, 0xcfd8e6], 10);
    }
    await strike();
  }

  await wait(200);
  S.busy = false;
  if(checkEnd()) return;
  S.turn = foe; renderAll();
  if(S.turn==='bot') botTurn();
  else { setTurn('🟢 เทิร์นของคุณ — คลิกยูนิตของคุณเพื่อโจมตี'); if(S.autoBattle) autoPlayerTurn(); }
}

async function runHeal(side, from, tr, tc){
  S.busy = true; S.attacker = null; clearPreview();
  const u = S.g[side][from.r][from.c]; if(!u){ S.busy=false; return; }
  const T = UNIT_TYPES[u.type];
  const target = S.g[side][tr][tc];
  if(!target || target.hp<=0){ S.busy=false; return; }
  const foe = side==='player' ? 'bot' : 'player';
  const who = side==='player' ? '[คุณ]' : '[บอท]';
  const tv  = S.v[side][tr][tc];

  const healAmount = Math.max(1, Math.round(T.atk * (T.healRatio||1.5) * (0.85+Math.random()*0.30)));
  const before = target.hp;
  target.hp = Math.min(target.max, target.hp + healAmount);
  const actual = target.hp - before;

  log(`${who} ${T.name} (${coord(from.r,from.c)}) → ฮีล ${coord(tr,tc)}`,'hl');
  setTurn(`${who} ${T.name} กำลังฮีล ${coord(tr,tc)}...`);

  healFX(tv.x, tv.y);
  await wait(220);
  updateHp(side,tr,tc);
  popText(tv.x, tv.y, `+${actual}`, '#4ade80', false);
  log(`   → ${UNIT_TYPES[target.type].name} (${coord(tr,tc)}) ได้รับการฮีล +${actual} · ตอนนี้ ${target.hp}/${target.max} HP`,'hl');

  await wait(320);
  S.busy = false;
  if(checkEnd()) return;
  S.turn = foe; renderAll();
  if(S.turn==='bot') botTurn();
  else { setTurn('🟢 เทิร์นของคุณ — คลิกยูนิตของคุณเพื่อโจมตี'); if(S.autoBattle) autoPlayerTurn(); }
}

/* ═══════════════════════════════════════════════════════════
   12) AI
   ═══════════════════════════════════════════════════════════ */
const THREAT = { bow:1.35, cannon:1.30, gun:1.15, axe:1.25, priest:1.10, spear:1.00, sword:0.85 };
const AI_LEVELS = {
  easy  : {label:'Easy',  think:600, blunder:.70, kill:0,  overkill:0,    wound:0,  snipe:0,  threat:false, top:6},
  normal: {label:'Normal',think:850, blunder:.20, kill:25, overkill:-.35, wound:6,  snipe:0,  threat:false, top:3},
  hard  : {label:'Hard',  think:1100,blunder:0,   kill:70, overkill:-.90, wound:20, snipe:14, threat:true,  top:1}
};

function isFront(side,r,c){
  const line = frontOrder(side).filter(rr=>{const u=S.g[side][rr][c]; return u&&u.hp>0;});
  return line[0]===r;
}
function scoreMove(atk, hits, foe, W){
  let s = 0;
  hits.forEach(h=>{
    const t = S.g[foe][h.r][h.c]; if(!t || t.hp<=0) return;
    const w   = W.threat ? (THREAT[t.type]||1) : 1;
    const eff = Math.min(h.damage, t.hp);
    s += eff * w;
    s += (h.damage - eff) * W.overkill;
    if(h.damage >= t.hp)           s += W.kill * w;
    else if(t.hp - h.damage <= 25) s += W.wound;
    if(atk.type==='bow' && !isFront(foe,h.r,h.c)) s += W.snipe;
  });
  return s;
}
function bestMove(W, me='bot', foe='player'){
  const out=[], seen=new Set();
  for(let ar=0;ar<GRID;ar++) for(let ac=0;ac<GRID;ac++){
    const u = S.g[me][ar][ac]; if(!u || u.hp<=0) continue;
    for(let tr=0;tr<GRID;tr++) for(let tc=0;tc<GRID;tc++){
      const hits = calculateDamage(u,tr,tc,foe);
      if(!hits.length) continue;
      const sig = `${ar}${ac}|` + hits.map(h=>`${h.r}${h.c}:${h.damage}`).join(',');
      if(seen.has(sig)) continue; seen.add(sig);
      out.push({from:{r:ar,c:ac}, tr, tc, type:u.type, score:scoreMove(u,hits,foe,W)});
    }
  }
  if(!out.length) return null;
  out.sort((a,b)=>b.score-a.score);
  if(Math.random() < W.blunder) return Phaser.Utils.Array.GetRandom(out);
  return Phaser.Utils.Array.GetRandom(out.slice(0, W.top));
}
function bestHealMove(me='bot'){
  let best=null;
  for(let ar=0;ar<GRID;ar++) for(let ac=0;ac<GRID;ac++){
    const u=S.g[me][ar][ac]; if(!u||u.hp<=0||!UNIT_TYPES[u.type].canHeal) continue;
    for(let tr=0;tr<GRID;tr++) for(let tc=0;tc<GRID;tc++){
      if(ar===tr && ac===tc) continue;
      const t=S.g[me][tr][tc]; if(!t||t.hp<=0) continue;
      const missing = t.max - t.hp; if(missing<=0) continue;
      if(!best || missing>best.missing) best={from:{r:ar,c:ac}, tr, tc, missing};
    }
  }
  return best;
}
const AUTO_BATTLE_W = {kill:60, overkill:-.70, wound:14, snipe:10, threat:true, top:1, blunder:0};
function autoPlayerTurn(){
  if(!S.autoBattle || S.turn!=='player' || S.busy || S.phase!=='battle') return;
  setTimeout(()=>{
    if(!S.autoBattle || S.turn!=='player' || S.busy || S.phase!=='battle') return;
    const heal = bestHealMove('player');
    if(heal && heal.missing/S.g.player[heal.tr][heal.tc].max >= 0.35){
      runHeal('player', heal.from, heal.tr, heal.tc);
      return;
    }
    const mv = bestMove(AUTO_BATTLE_W, 'player', 'bot');
    if(!mv) return;
    runAttack('player', mv.from, mv.tr, mv.tc);
  }, 550);
}
function botTurn(){
  const W = AI_LEVELS[S.ai];
  S.busy = true; setTurn(`🤖 บอท (${W.label}) กำลังคิด...`);
  setTimeout(()=>{
    S.busy = false;
    if(S.phase==='over') return;
    const heal = bestHealMove();
    if(heal && heal.missing/S.g.bot[heal.tr][heal.tc].max >= 0.35 && Math.random() > (S.ai==='easy'?0.5:0.15)){
      const u = S.g.bot[heal.from.r][heal.from.c];
      log(`🤖 ${UNIT_TYPES[u.type].name} ตัดสินใจฮีลพันธมิตรที่บาดเจ็บหนัก`,'ai');
      runHeal('bot', heal.from, heal.tr, heal.tc);
      return;
    }
    const mv = bestMove(W);
    if(!mv) return checkEnd();
    if(S.ai==='hard')
      log(`🤖 [Hard] ${UNIT_TYPES[mv.type].name} → ${coord(mv.tr,mv.tc)} (score ${mv.score.toFixed(0)})`,'ai');
    runAttack('bot', mv.from, mv.tr, mv.tc);
  }, W.think);
}
function smartDeploy(){
  const rows = frontOrder('bot');
  [['sword','spear','sword'], ['bow','gun','cannon']].forEach((line,i)=>
    line.forEach((t,c)=>{
      const r = rows[i];
      S.g.bot[r][c] = mkUnit(t);
      createView('bot', r, c, S.g.bot[r][c]);
    }));
  log('🤖 บอทจัดทัพเป็นระบบ: แนวหน้าแทงค์ / แนวหลังตัวยิง','ai');
}

/* ═══════════════════════════════════════════════════════════
   13) ADVENTURE MODE — 5 บท × 10 ด่าน · ด่าน 10 มี Boss 2×2
   ═══════════════════════════════════════════════════════════ */
function stageAiLevel(chapter,stage){
  if(stage===STAGES_PER_CHAPTER) return 'hard';
  const g = (chapter-1)*STAGES_PER_CHAPTER + stage;
  if(g<=15) return 'easy';
  if(g<=35) return 'normal';
  return 'hard';
}
function deployStageEnemies(chapter, stage){
  S.ai = stageAiLevel(chapter, stage);
  const isBossStage = stage===STAGES_PER_CHAPTER;
  const globalIdx = (chapter-1)*STAGES_PER_CHAPTER + stage;

  if(isBossStage){
    const boss = makeBoss(chapter);
    const ar=1, ac=0;
    for(let dr=0;dr<2;dr++) for(let dc=0;dc<2;dc++) S.g.bot[ar+dr][ac+dc] = boss;
    createBossView('bot', ar, ac, boss);

    const freeCells=[]; for(let r=0;r<GRID;r++)for(let c=0;c<GRID;c++) if(!S.g.bot[r][c]) freeCells.push([r,c]);
    Phaser.Utils.Array.Shuffle(freeCells);
    const escortMult = 1 + (chapter-1)*0.35;
    const escortCount = Math.min(freeCells.length, 1 + Math.floor(chapter/2));
    const escortPool = ['bow','gun','spear','sword','priest'];
    for(let i=0;i<escortCount;i++){
      const [r,c]=freeCells[i];
      const type = Phaser.Utils.Array.GetRandom(escortPool);
      S.g.bot[r][c] = mkUnit(type, escortMult);
      createView('bot', r, c, S.g.bot[r][c]);
    }
    log(`👹 ${CHAPTERS[chapter-1].boss} ปรากฏตัว! (ด่าน ${chapter}-${stage})`,'ai');
  } else {
    const n = Math.min(MAX_UNITS, 2 + Math.floor(globalIdx/6));
    const mult = 1 + (globalIdx-1)*0.045;
    const cells=[]; for(let r=0;r<GRID;r++)for(let c=0;c<GRID;c++) cells.push([r,c]);
    Phaser.Utils.Array.Shuffle(cells);
    const pool = ORDER.filter(t=>t!=='priest' || globalIdx>8);
    for(let i=0;i<n;i++){
      const [r,c]=cells[i];
      const type = Phaser.Utils.Array.GetRandom(pool);
      S.g.bot[r][c] = mkUnit(type, mult);
      createView('bot', r, c, S.g.bot[r][c]);
    }
    log(`⚔️ ศัตรูปรากฏตัว ${n} หน่วย (ด่าน ${chapter}-${stage})`,'ai');
  }
}
function onStageCleared(chapter, stage){
  const key = `${chapter}-${stage}`;
  campaignProgress.cleared[key] = true;
  if(stage > (campaignProgress.unlocked[chapter]||0)) campaignProgress.unlocked[chapter]=stage;
  if(stage===STAGES_PER_CHAPTER && chapter<CHAPTER_COUNT)
    campaignProgress.unlocked[chapter+1] = Math.max(campaignProgress.unlocked[chapter+1]||0, 1);
  saveProgress();
}
function healPlayerBoard(){
  for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++){
    const u=S.g.player[r][c];
    if(u){ u.hp=u.max; updateHp('player',r,c); }
  }
}
function clearBotBoard(){
  const seen = new Set();
  for(let r=0;r<GRID;r++) for(let c=0;c<GRID;c++){
    const v = S.v.bot[r][c];
    if(v && !seen.has(v)){ seen.add(v); v.destroy(); }
    S.g.bot[r][c] = null; S.v.bot[r][c] = null;
  }
}
function goToStage(chapter, stage){
  clearBotBoard();
  S.campaign = {chapter, stage};
  S.phase='deploy'; S.turn='player'; S.attacker=null; S.selected=null; S.pick=null; S.busy=false;
  $('btnReset').style.display='none';
  $('btnNextStage').style.display='none';
  $('btnRetryStage').style.display='none';
  $('stageSelectCard').style.display='none';
  setTurn(`📖 ด่าน ${chapter}-${stage}${stage===STAGES_PER_CHAPTER?' 👹 (BOSS)':''} — จัดทัพของคุณแล้วกด "เริ่มการต่อสู้"`);
  renderAll();
}
function renderStageSelect(){
  $('stageSelectBody').innerHTML = CHAPTERS.map((ch,i)=>{
    const chapter=i+1;
    const unlocked = campaignProgress.unlocked[chapter]||0;
    const chapterUnlocked = unlocked>0;
    const btns = Array.from({length:STAGES_PER_CHAPTER},(_,j)=>{
      const stage=j+1;
      const isBoss = stage===STAGES_PER_CHAPTER;
      const isCleared = !!campaignProgress.cleared[`${chapter}-${stage}`];
      const isLocked = stage>unlocked;
      const isSel = S.campaign && S.campaign.chapter===chapter && S.campaign.stage===stage;
      const cls=[isCleared?'done':'', isBoss?'boss':'', isSel?'sel':''].filter(Boolean).join(' ');
      const label = isBoss ? '☠' : stage;
      return `<button class="${cls}" data-c="${chapter}" data-s="${stage}" ${isLocked?'disabled':''}
        title="ด่าน ${chapter}-${stage}${isBoss?' (Boss)':''}">${label}</button>`;
    }).join('');
    return `<div class="stageRow">
      <div class="chapName${chapterUnlocked?'':' locked'}">${chapterUnlocked?'':'🔒 '}บทที่ ${chapter}: ${ch.name}${unlocked>=STAGES_PER_CHAPTER?' ✅':''}</div>
      <div class="stageGrid">${btns}</div>
    </div>`;
  }).join('');
}

/* ═══════════════════════════════════════════════════════════
   13) END GAME
   ═══════════════════════════════════════════════════════════ */
function checkEnd(){
  const p=alive('player').length, b=alive('bot').length;
  if(p&&b) return false;
  S.phase='over';
  const win = b===0 && p>0;
  const draw = !p && !b;
  let msg = draw ? '🤝 เสมอ!' : (win ? '🏆 VICTORY — คุณชนะ!' : '💀 DEFEAT — คุณแพ้...');
  let hasNext = false;

  if(S.mode==='adventure' && S.campaign){
    const {chapter,stage} = S.campaign;
    if(win){
      onStageCleared(chapter,stage);
      const bossBeat = stage===STAGES_PER_CHAPTER;
      msg = bossBeat
        ? `🏆 ปราบ ${CHAPTERS[chapter-1].boss} สำเร็จ! ผ่านด่าน ${chapter}-${stage} แล้ว!`
        : `🏆 ผ่านด่าน ${chapter}-${stage} แล้ว!`;
      if(bossBeat && chapter<CHAPTER_COUNT) msg += ` ปลดล็อกบทที่ ${chapter+1}!`;
      if(bossBeat && chapter===CHAPTER_COUNT) msg += ' 🎉 จบเกมผจญภัยทั้ง 5 บทแล้ว ยินดีด้วย!';
      hasNext = !(chapter===CHAPTER_COUNT && stage===STAGES_PER_CHAPTER);
    } else if(!draw){
      msg = `💀 แพ้ในด่าน ${chapter}-${stage}... ลองใหม่อีกครั้ง!`;
    }
  }

  log('════ '+msg+' ════','hl'); setTurn(msg);
  const t = scene.add.text(W/2, H/2, win?'VICTORY':'DEFEAT',
    {fontFamily:'"Press Start 2P"',fontSize:'26px',
     color:win?'#4ade80':'#ff5a5a', stroke:'#000', strokeThickness:6})
    .setOrigin(.5).setDepth(200).setScale(0);
  scene.tweens.add({targets:t, scale:1, duration:500, ease:'Back.easeOut'});
  $('btnReset').style.display='block';
  if(S.mode==='adventure' && S.campaign){
    $('btnRetryStage').style.display='block';
    $('btnNextStage').style.display = (win && hasNext) ? 'block' : 'none';
  }
  return true;
}

$('btnReset').onclick  = ()=> location.reload();
$('btnStart').onclick  = ()=>{
  if(S.mode==='adventure'){
    if(!S.campaign) return;
    deployStageEnemies(S.campaign.chapter, S.campaign.stage);
  } else {
    randomDeploy('bot');
  }
  S.phase='battle'; S.turn='player'; S.pick=null; S.selected=null;
  const label = S.mode==='adventure'
    ? `ด่าน ${S.campaign.chapter}-${S.campaign.stage} · ${AI_LEVELS[S.ai].label}`
    : AI_LEVELS[S.ai].label;
  log(`════ ⚔️ BATTLE START (${label}) ════`,'hl');
  setTurn('🟢 เทิร์นของคุณ — คลิกยูนิตของคุณ แล้วเลือกช่องเป้าหมายฝั่งศัตรู');
  renderAll();
  if(S.autoBattle) autoPlayerTurn();
};
log('👋 ยินดีต้อนรับสู่ PIXEL TACTICS!');
log('💡 คลิกเลือกยูนิตบนกระดาน แล้วคลิกช่องเป้าหมายเพื่อย้าย/สลับตำแหน่งได้ทันที!');
</script>
</body>
</html>
